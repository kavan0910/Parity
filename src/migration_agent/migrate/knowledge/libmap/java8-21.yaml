schema_version: 1
id: java8-21
version: 1
title: Java 8 -> Java 17/21 (removed and changed JDK APIs)
applies:
  source: {language: java, below: "21"}
  target: {language: java, at_least: "17"}
known:
  - "junit:junit"
  - "org.junit.jupiter:*"
  - "org.mockito:*"
  - "org.slf4j:*"
  - "ch.qos.logback:*"
  - "com.fasterxml.jackson.core:*"
  - "com.fasterxml.jackson.datatype:*"
  - "org.apache.commons:commons-lang3"
  - "com.google.guava:guava"
entries:
  - id: jaxb-removed
    title: JAXB (javax.xml.bind) was removed from the JDK in Java 11
    match:
      code: ['\bjavax\.xml\.bind\b']
      files: ["*.java", "*.kt"]
    replacement: jakarta.xml.bind:jakarta.xml.bind-api + org.glassfish.jaxb:jaxb-runtime (package jakarta.xml.bind)
    kind: removed_api
    severity: high
    note: JEP 320 removed the Java EE modules (JAXB, JAX-WS, JAF, CORBA, JTA's javax.transaction) from the JDK. Code compiles on 8 but not on 11+ without the standalone artifacts.
    source: https://openjdk.org/jeps/320
  - id: jaxws-activation-corba-removed
    title: JAX-WS, JavaBeans Activation and CORBA were removed from the JDK in Java 11
    match:
      code: ['\bjavax\.(xml\.ws|jws|activation|xml\.soap)\b', '\borg\.omg\.', '\bjavax\.rmi\.CORBA\b']
      files: ["*.java", "*.kt"]
    replacement: jakarta.xml.ws-api / jakarta.activation-api standalone artifacts; CORBA has no JDK replacement
    kind: removed_api
    severity: high
    note: Removed by JEP 320; CORBA needs a third-party ORB or a redesign.
    source: https://openjdk.org/jeps/320
  - id: security-manager
    title: SecurityManager is deprecated for removal and disabled by default (JEP 411, JDK 17; permanently disabled in JDK 24)
    match:
      code: ['\bSystem\.(get|set)SecurityManager\s*\(', '\bextends\s+SecurityManager\b', '\bAccessController\.doPrivileged\s*\(']
      files: ["*.java", "*.kt"]
    replacement: none in the JDK; move sandboxing to the process / container level
    kind: removed_api
    severity: high
    needs_decision: true
    note: System.setSecurityManager throws UnsupportedOperationException unless -Djava.security.manager=allow (17-23); JDK 24 cannot enable it at all. Behaviour that relied on permission checks disappears.
    source: https://openjdk.org/jeps/411
  - id: nashorn-removed
    title: Nashorn JavaScript engine was removed in Java 15
    match:
      code: ['\bjdk\.nashorn\b', 'getEngineByName\s*\(\s*"(nashorn|javascript|js|JavaScript|ECMAScript)"']
      files: ["*.java", "*.kt"]
    replacement: org.openjdk.nashorn:nashorn-core (standalone) or GraalJS
    kind: removed_api
    severity: high
    note: JEP 372 removed Nashorn; ScriptEngineManager.getEngineByName("nashorn") returns null on 15+, which usually surfaces as a NullPointerException.
    source: https://openjdk.org/jeps/372
  - id: sun-misc-internal
    title: Internal sun.* / com.sun.* APIs are strongly encapsulated (JEP 403, JDK 17)
    match:
      code: ['\bsun\.misc\.(BASE64Encoder|BASE64Decoder|Unsafe|Signal)\b', '\bsun\.(security|reflect|nio\.ch)\.', '\bcom\.sun\.image\.codec\.jpeg\b']
      files: ["*.java", "*.kt"]
    replacement: java.util.Base64, VarHandle / MethodHandles, public APIs
    kind: removed_api
    severity: high
    note: sun.misc.BASE64Encoder was removed in 9; other internals need --add-opens or fail with IllegalAccessError since --illegal-access was removed in 17.
    source: https://openjdk.org/jeps/403
  - id: thread-stop-suspend
    title: Thread.stop/suspend/resume throw UnsupportedOperationException (JDK 20+)
    match:
      code: ['\.(stop|suspend|resume)\s*\(\s*\)\s*;']
      files: ["*.java"]
      unless: []
    replacement: cooperative cancellation (interrupt + flag) or ExecutorService.shutdownNow
    kind: removed_api
    severity: medium
    note: The pattern matches any no-argument stop()/suspend()/resume() call; confirm the receiver is a Thread or ThreadGroup.
    source: https://bugs.openjdk.org/browse/JDK-8289610
  - id: boxed-constructors
    title: Boxed primitive constructors (new Integer(..)) are deprecated for removal
    match:
      code: ['\bnew\s+(Integer|Long|Short|Byte|Double|Float|Boolean|Character)\s*\(']
      files: ["*.java"]
    replacement: 'Integer.valueOf(..) and friends (note identity: valueOf caches -128..127)'
    kind: removed_api
    severity: low
    note: Deprecated for removal since 9/16 (JEP 390, value-based classes). Code comparing boxed values with == can change behaviour when switching to valueOf.
    source: https://openjdk.org/jeps/390
  - id: finalize
    title: Object.finalize is deprecated for removal (JEP 421)
    match:
      code: ['\bprotected\s+void\s+finalize\s*\(\s*\)']
      files: ["*.java"]
    replacement: try-with-resources / java.lang.ref.Cleaner
    kind: removed_api
    severity: medium
    note: Finalization can be disabled with --finalization=disabled and will be removed; resource release in finalize() silently stops.
    source: https://openjdk.org/jeps/421
  - id: applet-rmi-activation
    title: Applet API and RMI Activation were removed
    match:
      code: ['\bjava\.applet\b', '\bjava\.rmi\.activation\b']
      files: ["*.java"]
    replacement: none
    kind: removed_api
    severity: high
    note: RMI Activation removed in 17 (JEP 407); Applet API deprecated for removal (JEP 398).
    source: https://openjdk.org/jeps/407
  - id: default-charset-utf8
    title: Default charset is UTF-8 from JDK 18 (JEP 400)
    match:
      code: ['\bnew\s+(FileReader|FileWriter|InputStreamReader|OutputStreamWriter|PrintStream|Scanner)\s*\([^,()]*\)', '\.getBytes\s*\(\s*\)', '\bnew\s+String\s*\(\s*\w+\s*\)']
      files: ["*.java"]
    replacement: pass an explicit Charset where the legacy platform charset was not UTF-8
    kind: semantic_shift
    severity: low
    note: Calls without an explicit charset used the platform default (often windows-1252 / ISO-8859-1 on servers); on 18+ they use UTF-8, changing bytes for non-ASCII text.
    source: https://openjdk.org/jeps/400
  - id: cldr-locale-data
    title: CLDR locale data is the default from JDK 9 (date/number formats can change)
    match:
      code: ['\bnew\s+SimpleDateFormat\s*\(', '\bDateTimeFormatter\.ofLocalizedD', '\bNumberFormat\.get(Currency)?Instance\s*\(']
      files: ["*.java"]
    replacement: pin formats with explicit patterns or -Djava.locale.providers=COMPAT (removed in 23)
    kind: semantic_shift
    severity: low
    note: JEP 252 switched the default locale data to CLDR; localized formats (month names, separators, am/pm markers) may render differently, which shows up in responses and reports.
    source: https://openjdk.org/jeps/252
